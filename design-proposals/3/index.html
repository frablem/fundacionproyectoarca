  <style>
    :root {
      --arca-deep: #77368B;
      --arca-purple: #804996;
      --arca-olive: #AEB515;
      --arca-yellow: #DBCC00;
      --arca-lilac: #BF99D1;
      --arca-light-purple: #A46EBE;
      --arca-bright-yellow: #E4E43D;
      --arca-cream: #FFF39A;
      --arca-paper: #fffdf2;
      --arca-ink: #211a23;
      --arca-muted: #5c4d62;
      --max-content: 1260px;
      --condensed: "Cabin Condensed", "Gill Sans", "Trebuchet MS", sans-serif;
      --body: "Cabin", "Gill Sans", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: clip; }
    body {
      margin: 0;
      overflow-x: clip;
      background: var(--arca-paper);
      color: var(--arca-ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.55;
    }
    body, button, a, input { font-family: var(--body); }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    :focus-visible {
      outline: 3px solid var(--arca-yellow);
      outline-offset: 4px;
    }
    .skip-link {
      position: fixed;
      z-index: 100;
      left: 1rem;
      top: -5rem;
      padding: .75rem 1rem;
      border-radius: 0 0 .6rem .6rem;
      background: var(--arca-yellow);
      color: var(--arca-ink);
      font-weight: 700;
      transition: top .2s ease;
    }
    .skip-link:focus { top: 0; }
    .container {
      width: min(calc(100% - 2.5rem), var(--max-content));
      margin-inline: auto;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: 0;
      color: var(--arca-purple);
      font-family: var(--condensed);
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 2.6rem;
      height: .2rem;
      background: currentColor;
      content: "";
    }
    .section-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2rem;
      height: 2.2rem;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-family: var(--condensed);
      font-size: .85rem;
      letter-spacing: .08em;
    }
    .section-header {
      display: grid;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    main section[id] { scroll-margin-top: 5rem; }
    .section-header h2 {
      max-width: 15ch;
      margin: 0;
      color: var(--arca-deep);
      font-family: var(--condensed);
      font-size: clamp(2.7rem, 7vw, 6.5rem);
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: .88;
      text-wrap: balance;
    }
    .section-header p {
      max-width: 49ch;
      margin: 0;
      color: var(--arca-muted);
      font-size: 1.06rem;
    }
    .reveal {
      opacity: 0;
      transform: translateY(1.25rem);
      transition: opacity .7s ease, transform .7s ease;
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }
    .delay-1 { transition-delay: .08s; }
    .delay-2 { transition-delay: .16s; }
    .delay-3 { transition-delay: .24s; }

    /* Header and navigation */
    .site-header {
      position: sticky;
      z-index: 40;
      top: 0;
      border-bottom: 1px solid rgba(119, 54, 139, .14);
      background: rgba(255, 253, 242, .94);
      backdrop-filter: blur(16px);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 4.65rem;
      gap: 1rem;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      color: var(--arca-deep);
      text-decoration: none;
    }
    .brand-link img {
      width: 3rem;
      height: 3rem;
      object-fit: contain;
    }
    .brand-text {
      display: grid;
      gap: .08rem;
      line-height: 1;
    }
    .brand-text strong {
      font-family: var(--condensed);
      font-size: 1.2rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .brand-text span {
      color: var(--arca-muted);
      font-size: .72rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.8rem;
      height: 2.8rem;
      border: 1px solid var(--arca-deep);
      border-radius: 50%;
      background: transparent;
      color: var(--arca-deep);
    }
    .menu-lines {
      display: grid;
      gap: .25rem;
      width: 1.05rem;
    }
    .menu-lines span {
      display: block;
      height: 2px;
      background: currentColor;
      transition: transform .2s ease, opacity .2s ease;
    }
    .menu-toggle[aria-expanded="true"] .menu-lines span:first-child { transform: translateY(.23rem) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] .menu-lines span:last-child { transform: translateY(-.23rem) rotate(-45deg); }
    .site-menu {
      position: absolute;
      top: calc(100% + 1px);
      right: 1.25rem;
      left: 1.25rem;
      display: none;
      padding: .65rem;
      border: 1px solid rgba(119, 54, 139, .2);
      border-top: 0;
      background: var(--arca-paper);
      box-shadow: 0 1.5rem 3rem rgba(53, 24, 64, .12);
    }
    .site-menu.is-open { display: grid; }
    .site-menu a {
      padding: .78rem .85rem;
      border-bottom: 1px solid rgba(119, 54, 139, .11);
      color: var(--arca-deep);
      font-weight: 600;
      text-decoration: none;
    }
    .site-menu a:last-child { border-bottom: 0; }
    .site-menu a:hover { background: rgba(191, 153, 209, .18); }
    .site-menu a.is-active { color: var(--arca-purple); }
    .header-actions {
      display: none;
      align-items: center;
      gap: .8rem;
    }
    .instagram-link {
      color: var(--arca-deep);
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
    }
    .instagram-link:hover { color: var(--arca-purple); }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: .78rem 1.25rem;
      border: 1px solid transparent;
      border-radius: 999px;
      font-family: var(--condensed);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 .7rem 1.5rem rgba(43, 22, 53, .16); }
    .button-primary { background: var(--arca-yellow); color: var(--arca-ink); }
    .button-secondary { border-color: var(--arca-deep); color: var(--arca-deep); }
    .button-secondary:hover { background: var(--arca-deep); color: var(--arca-paper); }
    .button-light { border-color: rgba(255, 255, 255, .7); color: #fff; }
    .button-light:hover { background: #fff; color: var(--arca-deep); }
    .arrow-link {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      color: var(--arca-deep);
      font-family: var(--condensed);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
    }
    .arrow-link::after {
      display: inline-block;
      content: "↗";
      font-family: var(--body);
      font-size: 1.35rem;
      line-height: 1;
      transition: transform .2s ease;
    }
    .arrow-link:hover::after { transform: translate(.2rem, -.2rem); }

    /* Sculptural hero */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 3.8rem 0 4.5rem;
      background: var(--arca-deep);
      color: #fff;
      isolation: isolate;
    }
    .hero::before {
      position: absolute;
      z-index: -1;
      top: -13rem;
      right: -15rem;
      width: 42rem;
      height: 42rem;
      border: 1px solid rgba(255, 243, 154, .36);
      border-radius: 50%;
      content: "";
    }
    .hero::after {
      position: absolute;
      z-index: -1;
      right: 31%;
      bottom: -17rem;
      width: 32rem;
      height: 32rem;
      border: 1px solid rgba(191, 153, 209, .35);
      border-radius: 50%;
      content: "";
    }
    .hero-grid {
      display: grid;
      gap: 3rem;
      align-items: center;
    }
    .hero-copy { position: relative; z-index: 2; }
    .hero .eyebrow { color: var(--arca-cream); }
    .hero h1 {
      max-width: 10ch;
      margin: 1.25rem 0 1.45rem;
      font-family: var(--condensed);
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 600;
      letter-spacing: -.06em;
      line-height: .78;
      text-wrap: balance;
    }
    .hero h1 span, .hero h1 em { display: block; }
    .hero h1 span:nth-child(2) { margin-left: .68em; color: var(--arca-yellow); }
    .hero h1 em {
      margin-left: .12em;
      color: var(--arca-cream);
      font-style: normal;
      font-size: .67em;
      letter-spacing: -.04em;
    }
    .hero h1 span:last-child { margin-left: .85em; color: var(--arca-bright-yellow); }
    .hero-lead {
      max-width: 47ch;
      margin: 0;
      color: rgba(255, 255, 255, .86);
      font-size: 1.08rem;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      margin-top: 2rem;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1.2rem;
      margin: 2.2rem 0 0;
      color: rgba(255, 255, 255, .72);
      font-family: var(--condensed);
      font-size: .91rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .hero-meta strong { color: var(--arca-cream); }
    .hero-art {
      position: relative;
      min-height: 24rem;
    }
    .hero-window {
      position: absolute;
      top: 0;
      right: 4%;
      width: min(86vw, 25rem);
      height: min(108vw, 32rem);
      overflow: hidden;
      border: .7rem solid var(--arca-cream);
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 31% 31% 0 0;
      box-shadow: 1.3rem 1.3rem 0 var(--arca-olive);
      transform: rotate(3deg);
    }
    .hero-window::after {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .42);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }
    .hero-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.86) contrast(1.04);
    }
    .hero-art-ring {
      position: absolute;
      z-index: -1;
      right: -2%;
      bottom: -1rem;
      width: 12rem;
      height: 12rem;
      border: 1.2rem solid var(--arca-yellow);
      border-radius: 50%;
      opacity: .96;
    }
    .hero-art-caption {
      position: absolute;
      z-index: 3;
      right: 0;
      bottom: .4rem;
      display: grid;
      gap: .1rem;
      padding: .75rem 1rem;
      background: var(--arca-yellow);
      color: var(--arca-ink);
      font-family: var(--condensed);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .hero-art-caption span:first-child { color: var(--arca-deep); font-size: 1.35rem; }

    /* Mission */
    .mission {
      padding: 5.7rem 0 6.3rem;
      background: var(--arca-paper);
    }
    .mission-intro {
      display: grid;
      gap: 1.4rem;
      max-width: 920px;
      margin-bottom: 3.8rem;
    }
    .mission-intro h2 {
      max-width: 15ch;
      margin: 0;
      color: var(--arca-deep);
      font-family: var(--condensed);
      font-size: clamp(3rem, 8vw, 7.2rem);
      font-weight: 600;
      letter-spacing: -.06em;
      line-height: .84;
      text-wrap: balance;
    }
    .mission-intro p {
      max-width: 58ch;
      margin: 0;
      color: var(--arca-muted);
      font-size: 1.12rem;
    }
    .pillar-grid {
      display: grid;
      gap: 1rem;
    }
    .pillar {
      position: relative;
      min-height: 14rem;
      padding: 1.5rem;
      border-top: 1px solid var(--arca-deep);
      background: #fff;
    }
    .pillar::after {
      position: absolute;
      right: 1.25rem;
      bottom: -1.7rem;
      width: 4.4rem;
      height: 4.4rem;
      border: .65rem solid var(--arca-lilac);
      border-radius: 50%;
      content: "";
    }
    .pillar:nth-child(2)::after { border-color: var(--arca-olive); border-radius: 50% 50% 0 0; }
    .pillar:nth-child(3)::after { border-color: var(--arca-yellow); }
    .pillar-number {
      color: var(--arca-purple);
      font-family: var(--condensed);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .pillar h3 {
      max-width: 15ch;
      margin: 2rem 0 .7rem;
      color: var(--arca-deep);
      font-family: var(--condensed);
      font-size: 2.1rem;
      letter-spacing: -.03em;
      line-height: .95;
    }
    .pillar p { max-width: 34ch; margin: 0; color: var(--arca-muted); }

    /* Adoptable gallery */
    .adoption-section {
      padding: 5.7rem 0 6rem;
      background: var(--arca-cream);
    }
    .adoption-section .section-header {
      grid-template-columns: 1fr;
    }
    .adoption-section .eyebrow { color: var(--arca-deep); }
    .adoption-section .section-header h2 { color: var(--arca-deep); }
    .stand-in-note {
      max-width: 54rem;
      margin: -1rem 0 2rem;
      padding: .8rem 1rem;
      border-left: .3rem solid var(--arca-purple);
      background: rgba(255, 255, 255, .55);
      color: var(--arca-ink);
      font-size: .91rem;
    }
    .adoption-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .9rem;
    }
    .cat-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: var(--arca-deep);
      color: #fff;
      text-decoration: none;
    }
    .cat-card:nth-child(n + 5) { display: none; }
    .cat-card figure { margin: 0; }
    .cat-card-image {
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }
    .cat-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.8);
      transition: transform .55s ease, filter .55s ease;
    }
    .cat-card:hover .cat-card-image img { transform: scale(1.05); filter: saturate(1); }
    .cat-card-body {
      display: grid;
      gap: .35rem;
      min-height: 6.8rem;
      padding: .95rem;
    }
    .cat-card-body h3 {
      margin: 0;
      font-family: var(--condensed);
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1;
    }
    .cat-card-body p {
      margin: 0;
      color: rgba(255, 255, 255, .72);
      font-size: .86rem;
    }
    .cat-card-tag {
      position: absolute;
      top: .65rem;
      left: .65rem;
      padding: .3rem .48rem;
      background: var(--arca-yellow);
      color: var(--arca-ink);
      font-family: var(--condensed);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .adoption-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      margin-top: 2.4rem;
    }
    .adoption-footer p { max-width: 43ch; margin: 0; color: var(--arca-ink); }
    .adoption-footer .arrow-link { color: var(--arca-deep); }

    /* Stories and content teaser */
    .stories {
      padding: 5.7rem 0 6.2rem;
      background: var(--arca-paper);
    }
    .stories-grid {
      display: grid;
      gap: 1.2rem;
    }
    .story-card {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: 1rem;
      align-items: start;
      padding: 1.1rem 0;
      border-top: 1px solid rgba(119, 54, 139, .4);
    }
    .story-card:first-child { border-top: 2px solid var(--arca-deep); }
    .story-index {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--arca-lilac);
      color: var(--arca-deep);
      font-family: var(--condensed);
      font-size: 1.5rem;
      font-weight: 700;
    }
    .story-card:nth-child(2) .story-index { border-radius: 50% 50% 0 0; background: var(--arca-olive); color: var(--arca-ink); }
    .story-card h3 {
      margin: 0 0 .35rem;
      color: var(--arca-deep);
      font-family: var(--condensed);
      font-size: 1.8rem;
      line-height: .96;
    }
    .story-card p { margin: 0; color: var(--arca-muted); }
    .story-card small {
      display: inline-block;
      margin-bottom: .6rem;
      color: var(--arca-purple);
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .stories-note {
      margin: 2.3rem 0 0;
      color: var(--arca-muted);
      font-size: .88rem;
    }

    /* Ways to help */
    .help-section {
      padding: 5.7rem 0 6rem;
      background: var(--arca-purple);
      color: #fff;
    }
    .help-section .eyebrow { color: var(--arca-cream); }

    .help-section .section-header p { color: rgba(255, 255, 255, .82); }
    .help-grid {
      display: grid;
      gap: 1px;
      background: rgba(255, 255, 255, .42);
    }
    .help-card {
      display: grid;
      gap: 1.2rem;
      min-height: 15.5rem;
      padding: 1.5rem;
      background: var(--arca-purple);
    }
    .help-card:nth-child(2) { background: var(--arca-deep); }
    .help-card:nth-child(3) { background: var(--arca-olive); color: var(--arca-ink); }
    .help-card:nth-child(4) { background: var(--arca-yellow); color: var(--arca-ink); }
    .help-card-number {
      font-family: var(--condensed);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .12em;

  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;

    const BASE_URL = "";
    const GA_ID = "";
    const FOUNDATION_NAME = "Fundación Proyecto Arca";
    const CONTACT_EMAIL = "proyectoarcacoquimbo@gmail.com";
    const INSTAGRAM_URL = "https://www.instagram.com/fundacionproyectoarca/";
    const EDUCATION_INSTAGRAM_URL = "https://www.instagram.com/proyectoarcaeduca/";

    const navItems = [
      { key: "inicio", name: "Inicio", href: "/" },
      { key: "nosotras", name: "Nosotras", href: "/nosotros" },
      { key: "adoptar", name: "Adoptar", href: "/adoptar" },
      { key: "ayudar", name: "Cómo ayudar", href: "/como-ayudar" },
      { key: "noticias", name: "Noticias", href: "/noticias" },
      { key: "historias", name: "Historias", href: "/historias" },
      { key: "contacto", name: "Contacto", href: "/contacto" }
    ];

    const standInCats = [
      {
        name: "Lila",
        detail: "Joven · Santiago",
        image: "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=900&q=86"
      },
      {
        name: "Bruno",
        detail: "Adulto · Coquimbo",
        image: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=900&q=86"
      },
      {
        name: "Menta",
        detail: "Joven · La Serena",
        image: "https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=900&q=86"
      },
      {
        name: "Nilo",
        detail: "Adulto · Santiago",
        image: "https://images.unsplash.com/photo-1513245543132-31f507417b26?auto=format&fit=crop&w=900&q=86"
      },
      {
        name: "Circe",
        detail: "Joven · La Serena",
        image: "https://images.unsplash.com/photo-1495360010541-f48722b34f7d?auto=format&fit=crop&w=900&q=86"
      }
    ];

    /* Proposal-only stand-in: this replaces the native Petfi widget until its foundation ID is supplied.
       In the final site, Petfi owns the card markup and styling inside Shadow DOM. */
    const SHOW_REFERENCE_CONTENT = true;

    function trackEvent(name, params) {
      if (typeof window.gtag === "function") {
        window.gtag("event", name, params || {});
      }
    }

    if (GA_ID) {
      const gaScript = document.createElement("script");
      gaScript.async = true;
      gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
      document.head.appendChild(gaScript);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date());
      window.gtag("config", GA_ID);
    }

    const seoConfigByPath = {
      "/": {
        description: "Fundación Proyecto Arca rescata, rehabilita y busca hogares responsables para gatos abandonados en La Serena, Coquimbo y Santiago.",
        keywords: "rescate felino, adopción responsable, gatos, La Serena, Coquimbo, Santiago"
      }
    };

    function initSeo() {
      const path = window.location.pathname.replace(/\/+$/, "") || "/";
      const config = seoConfigByPath[path] || seoConfigByPath["/"];
      const description = document.querySelector('meta[name="description"]');
      const keywords = document.querySelector('meta[name="keywords"]');
      if (description) description.setAttribute("content", config.description);
      if (keywords) keywords.setAttribute("content", config.keywords);
      if (BASE_URL) {
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement("link");
          canonical.rel = "canonical";
          document.head.appendChild(canonical);
        }
        canonical.href = BASE_URL + (path === "/" ? "/" : path);
      }
    }

    function useReveal() {
      useEffect(function () {
        const reveal = function () {
          const elements = document.querySelectorAll(".reveal:not(.in)");
          if (!("IntersectionObserver" in window)) {
            elements.forEach(function (element) { element.classList.add("in"); });
            return;
          }
          const observer = new IntersectionObserver(function (entries, instance) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("in");
                instance.unobserve(entry.target);
              }
            });
          }, { rootMargin: "0px 0px -8% 0px", threshold: .08 });
          elements.forEach(function (element) { observer.observe(element); });
          return observer;
        };
        let observer = reveal();
        const mutationObserver = new MutationObserver(function () {
          if (observer) observer.disconnect();
          observer = reveal();
        });
        mutationObserver.observe(document.body, { childList: true, subtree: true });
        const sweep = window.setTimeout(function () {
          document.querySelectorAll(".reveal:not(.in)").forEach(function (element) { element.classList.add("in"); });
        }, 1800);
        return function () {
          if (observer) observer.disconnect();
          mutationObserver.disconnect();
          window.clearTimeout(sweep);
        };
      }, []);
    }

    function Navbar() {
      const [open, setOpen] = useState(false);
      useEffect(function () {
        const closeOnEscape = function (event) {
          if (event.key === "Escape") setOpen(false);
        };
        document.addEventListener("keydown", closeOnEscape);
        return function () { document.removeEventListener("keydown", closeOnEscape); };
      }, []);
      return (
        <header className="site-header">
          <div className="container header-inner">
            <a className="brand-link" href="/" onClick={function () { setOpen(false); }}>
              <img src="/media/logo.png" alt="Logo de Fundación Proyecto Arca" />
              <span className="brand-text">
                <strong>Proyecto Arca</strong>
                <span>Rescate felino</span>
              </span>
            </a>
            <button
              className="menu-toggle"
              type="button"
              aria-label={open ? "Cerrar menú" : "Abrir menú"}
              aria-expanded={open}
              aria-controls="site-menu"
              onClick={function () { setOpen(!open); }}
            >
              <span className="menu-lines" aria-hidden="true"><span></span><span></span></span>
            </button>
            <nav id="site-menu" className={"site-menu" + (open ? " is-open" : "")} aria-label="Navegación principal">
              {navItems.map(function (item) {
                return (
                  <a
                    key={item.key}
                    className={item.key === "inicio" ? "is-active" : ""}
                    href={item.href}
                    onClick={function () {
                      setOpen(false);
                      if (item.key === "adoptar") trackEvent("adoption_start", { placement: "navbar" });
                    }}
                  >
                    {item.name}
                  </a>
                );
              })}
            </nav>
            <div className="header-actions">
              <a className="instagram-link" href={INSTAGRAM_URL} target="_blank" rel="noreferrer">Instagram</a>
              <a className="button button-primary" href="/donar" onClick={function () { trackEvent("donation_start", { placement: "navbar" }); }}>Donar</a>
            </div>
          </div>
        </header>
      );
    }

    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const textArea = document.createElement("textarea");
      textArea.value = value;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand("copy");
      textArea.remove();
    }

    function CopyButton(props) {
      const [copied, setCopied] = useState(false);
      return (
        <button
          className="copy-button"
          type="button"
          onClick={function () {
            copyText(props.value).then(function () {
              setCopied(true);
              window.setTimeout(function () { setCopied(false); }, 2200);
            }).catch(function () { setCopied(false); });
          }}
          aria-label={"Copiar " + props.label}
        >
          {copied ? "Copiado" : props.value}
        </button>
      );
    }

    function Footer() {
      return (
        <footer className="site-footer">
          <div className="container">
            <div className="footer-grid">
              <div>
                <div className="footer-brand">
                  <img src="/media/logo.png" alt="" aria-hidden="true" />
                  <span>Fundación<br />Proyecto Arca</span>
                </div>

    function Hero() {
      return (
        <section className="hero" id="inicio" aria-labelledby="hero-title">
          <div className="container hero-grid">
            <div className="hero-copy reveal">
              <p className="eyebrow">Fundación Proyecto Arca · Rescate felino</p>
              <h1 id="hero-title"><span>Rescatamos</span><span>vidas,</span><em>transformamos</em><span>historias.</span></h1>
              <p className="hero-lead">Protegemos gatos abandonados en La Serena, Coquimbo y Santiago. Rescatamos, rehabilitamos y acompañamos cada historia hasta encontrar una familia responsable.</p>
              <div className="hero-actions">
                <a className="button button-primary" href="/adoptar" onClick={function () { trackEvent("adoption_start", { placement: "hero" }); }}>Conoce a los gatos</a>
                <a className="button button-light" href="/donar" onClick={function () { trackEvent("donation_start", { placement: "hero" }); }}>Quiero donar</a>
              </div>
              <p className="hero-meta"><strong>Gatos solamente</strong><span>Santiago · La Serena · Coquimbo</span></p>
            </div>
            <div className="hero-art reveal delay-2" aria-label="Ventana fotográfica con un gato, imagen de referencia reemplazable">
              {/* PLACEHOLDER: reemplazar por una foto real de un rescate felino de Fundación Proyecto Arca. */}
              <div className="hero-window">
                <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=1000&q=88" alt="Gato en una ventana; imagen de referencia para esta propuesta" />
              </div>
              <div className="hero-art-ring" aria-hidden="true"></div>
              <div className="hero-art-caption"><span>01</span><span>Una vida<br />a la vez</span></div>
            </div>
          </div>
        </section>
      );
    }

    function Mission() {
      return (
        <section className="mission" id="nosotras" aria-labelledby="mission-title">
          <div className="container">
            <div className="mission-intro reveal">
              <h2 id="mission-title">El cuidado también necesita un lugar.</h2>
              <p>Somos una fundación de mujeres que trabaja para que un gato abandonado no quede definido por el lugar donde fue encontrado. Abrimos espacio para rescatar, cuidar, educar y construir encuentros responsables entre animales y familias.</p>
            </div>
            <div className="pillar-grid">
              <article className="pillar reveal">
                <span className="pillar-number">01 / RESCATE</span>
                <h3>Intervenimos a tiempo.</h3>
                <p>Protegemos gatos abandonados y coordinamos su traslado, evaluación y recuperación con una mirada integral.</p>
              </article>
              <article className="pillar reveal delay-1">
                <span className="pillar-number">02 / CUIDADO</span>
                <h3>La recuperación es parte del hogar.</h3>
                <p>Entregamos cuidados y acompañamiento para que cada gato pueda volver a confiar y prepararse para una vida segura.</p>
              </article>
              <article className="pillar reveal delay-2">
                <span className="pillar-number">03 / EDUCACIÓN</span>
                <h3>Prevenir también es rescatar.</h3>
                <p>Promovemos la guardianía responsable y el respeto por los animales mediante contenidos y charlas en centros educativos.</p>
              </article>
            </div>
          </div>
        </section>
      );
    }

    function AdoptionGallery() {
      return (
        <section className="adoption-section" id="adopciones" aria-labelledby="adoption-title">
          <div className="container">
            <div className="section-header reveal">
              <div>
                <p className="eyebrow"><span className="section-number">02</span> Adopción responsable</p>
                <h2 id="adoption-title">Una vida espera una decisión.</h2>
              </div>
              <p>Adoptar es abrir un lugar en la casa y en la rutina. Conoce el catálogo completo y encuentra el vínculo que pueda crecer contigo.</p>
            </div>
            <p className="stand-in-note" role="note"><strong>Propuesta visual:</strong> estas cinco fichas son datos e imágenes de referencia para mostrar el ritmo de la galería. En la versión publicada, este espacio será el widget nativo de Petfi, filtrado para gatos, con cuatro animales en móvil y cinco en escritorio.</p>
            <div className="adoption-grid" aria-label="Gatos disponibles, fichas de referencia visual">
              {standInCats.map(function (cat, index) {
                return (
                  <a className="cat-card reveal" key={cat.name} href="/adoptar" onClick={function () { trackEvent("adoption_start", { placement: "home_gallery", animal_identifier: "reference_" + (index + 1) }); }}>
                    <span className="cat-card-tag">Referencia visual</span>
                    <figure>
                      <div className="cat-card-image">
                        {/* PLACEHOLDER: reemplazar por fotografía real; esta imagen externa solo es referencia de encuadre. */}
                        <img src={cat.image} alt={"Imagen de referencia de " + cat.name + ", reemplazar por foto real"} loading="lazy" />
                      </div>
                      <figcaption className="cat-card-body">
                        <h3>{cat.name}</h3>
                        <p>{cat.detail}</p>
                      </figcaption>
                    </figure>
                  </a>
                );
              })}
            </div>
            <div className="adoption-footer reveal">
              <p>El proceso de adopción busca una relación duradera y responsable, con información clara para ambas partes.</p>
              <a className="arrow-link" href="/adoptar" onClick={function () { trackEvent("adoption_start", { placement: "home_gallery_footer" }); }}>Ver todos los gatos</a>
            </div>
          </div>
        </section>
      );
    }

    function StoriesTeaser() {
      if (!SHOW_REFERENCE_CONTENT) {
        return null;
      }
      return (
        <section className="stories" id="historias" aria-labelledby="stories-title" data-cms-state="reference">
          <div className="container">
            <div className="section-header reveal">
              <p className="eyebrow"><span className="section-number">03</span> Historias y noticias</p>
              <h2 id="stories-title">Cada rescate deja una huella.</h2>
              <p>El CMS permitirá publicar noticias, aprendizajes y relatos de rescate sin perder la intimidad de cada proceso.</p>
            </div>
            <div className="stories-grid">
              <article className="story-card reveal">
                <span className="story-index" aria-hidden="true">A</span>
                <div>
                  <small>Ejemplo de contenido para el CMS</small>
                  <h3>Cómo acompañamos un rescate felino</h3>
                  <p>Un espacio para explicar, con calma y transparencia, qué ocurre desde el primer aviso hasta la recuperación.</p>
                </div>
              </article>
              <article className="story-card reveal delay-1">
                <span className="story-index" aria-hidden="true">B</span>
                <div>
                  <small>Borrador editorial de referencia</small>
                  <h3>Lo que significa abrir la puerta</h3>
                  <p>Historias para que las familias conozcan la adopción responsable y puedan decidir con información.</p>
                </div>
              </article>
            </div>
            <p className="stories-note">Estas entradas son referencias para visualizar el módulo. Cuando el CMS esté vacío, la sección podrá ocultarse y la página conservará su recorrido principal.</p>
            <a className="arrow-link reveal" href="/noticias">Explorar noticias</a>
          </div>
        </section>
      );
    }

    function WaysToHelp() {
      const helpItems = [
        { number: "01 / DONAR", title: "Sostener el cuidado", copy: "Una transferencia ayuda a cubrir alimentación, atención veterinaria y traslados.", href: "/donar", event: "donation_start" },
        { number: "02 / ADOPTAR", title: "Abrir un hogar", copy: "Conoce el proceso y encuentra una adopción que se construya con tiempo y compromiso.", href: "/adoptar", event: "adoption_start" },
        { number: "03 / ACOMPAÑAR", title: "Ser hogar temporal", copy: "Conversa con nosotras si puedes ofrecer un espacio seguro durante una recuperación.", href: "mailto:" + CONTACT_EMAIL, event: "contact_start" },
        { number: "04 / DIFUNDIR", title: "Hacer circular una historia", copy: "Comparte nuestras publicaciones y contenidos de educación para llegar a más guardianes responsables.", href: INSTAGRAM_URL, event: "contact_start" }
      ];
      return (
        <section className="help-section" id="ayudar" aria-labelledby="help-title">
          <div className="container">
            <div className="section-header reveal">
              <p className="eyebrow"><span className="section-number">04</span> Cómo ayudar</p>
              <h2 id="help-title">Hay muchas formas de hacer espacio.</h2>
              <p>Elige una acción posible para ti. Cuando se sostiene en comunidad, cada gesto se convierte en cuidado concreto.</p>
            </div>
            <div className="help-grid">
              {helpItems.map(function (item) {
                return (
                  <article className="help-card reveal" key={item.number}>
                    <span className="help-card-number">{item.number}</span>
                    <div>
                      <h3>{item.title}</h3>
                      <p>{item.copy}</p>
                    </div>
                    <a className="arrow-link" href={item.href} target={item.href.indexOf("http") === 0 ? "_blank" : undefined} rel={item.href.indexOf("http") === 0 ? "noreferrer" : undefined} onClick={function () { trackEvent(item.event, { placement: "help_grid", help_type: item.number.split(" / ")[1].toLowerCase() }); }}>Quiero participar</a>
                  </article>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    function Donation() {
      const bankFields = [
        { label: "Nombre", value: "Fundación Proyecto Arca" },
        { label: "RUT", value: "65.201.899-8" },
        { label: "Banco", value: "Banco Santander" },
        { label: "Tipo", value: "Cuenta corriente" },
        { label: "N° cuenta", value: "91975505" },
        { label: "Comprobantes", value: CONTACT_EMAIL }
      ];
      return (
        <section className="donation-section" id="donar" aria-labelledby="donation-title">
          <div className="container">
            <div className="donation-layout">
              <div className="donation-copy reveal">
                <p className="eyebrow"><span className="section-number">05</span> Donar</p>
                <h2 id="donation-title">Tu aporte se vuelve cuidado.</h2>
                <p>La alimentación, los controles veterinarios y cada traslado necesitan una red que los sostenga. Si quieres contribuir, puedes hacerlo mediante transferencia bancaria en pesos chilenos.</p>
                <div className="donation-foot">
                  <span>¿Tienes dudas?</span>
                  <a href={"mailto:" + CONTACT_EMAIL} onClick={function () { trackEvent("contact_start", { placement: "donation_section" }); }}>Escríbenos</a>
                </div>
              </div>
              <div className="bank-card reveal delay-1">
                <h3>Transferencia bancaria</h3>
                <p>Presiona cualquier dato para copiarlo. Envíanos el comprobante al correo indicado.</p>
                <ul className="bank-list">
                  {bankFields.map(function (field) {
                    return (
                      <li key={field.label}>
                        <span>{field.label}</span>
                        <CopyButton label={field.label} value={field.value} />
                      </li>
                    );
                  })}
                </ul>
                <p className="copy-state" aria-live="polite">Tus datos se mantienen en tu dispositivo.</p>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function ContactStrip() {
      return (
        <section className="contact-section" id="contacto" aria-labelledby="contact-title">
          <div className="container contact-inner">
            <div className="reveal">
              <p className="eyebrow">Hablemos</p>
              <h2 id="contact-title">Una pregunta también puede abrir un camino.</h2>
              <p>Si necesitas orientación sobre adopción, quieres colaborar o tienes información sobre un gato que necesita ayuda, escríbenos.</p>
            </div>
            <div className="contact-links reveal delay-1">
              <a href={"mailto:" + CONTACT_EMAIL} onClick={function () { trackEvent("contact_start", { placement: "contact_strip" }); }}>{CONTACT_EMAIL}</a>
              <a href={INSTAGRAM_URL} target="_blank" rel="noreferrer">@fundacionproyectoarca</a>
              <a href={EDUCATION_INSTAGRAM_URL} target="_blank" rel="noreferrer">@proyectoarcaeduca</a>
            </div>
          </div>
        </section>
      );
    }

    function App() {
      useReveal();
      useEffect(function () { initSeo(); }, []);
      return (
        <>
          <Navbar />
          <main id="contenido">
            <Hero />
            <Mission />
            <AdoptionGallery />
            <StoriesTeaser />
            <WaysToHelp />
            <Donation />
            <ContactStrip />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
