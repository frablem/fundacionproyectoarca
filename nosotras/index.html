  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { initializeFirestore, collection, query, where, orderBy, limit, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyBVEpigRETBVYVcEhL1fvG0oM-Eph6teiI", authDomain: "fundacion-cloe.firebaseapp.com", projectId: "fundacion-cloe", storageBucket: "fundacion-cloe.firebasestorage.app", messagingSenderId: "911205802218", appId: "1:911205802218:web:86acc81671f9e643da7793" };
    const FOUNDATION_UID = "sbvzDic2J1XpbstGsWYU4I4KkMy1";
    const APP_ID = "fundacion-cloe";
    const app = initializeApp(firebaseConfig); const db = initializeFirestore(app, { experimentalForceLongPolling: true });
    window.FBase = { db, collection, query, where, orderBy, limit, onSnapshot, getDocs, FOUNDATION_UID, APP_ID };

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div id="root"></div>

  <script type="text/babel">
    const { Navbar, Footer, IconArrow, IconCheck, trackEvent } = window.SharedComponents;
    const { useReveal, MapaCuidado, CierreCTA } = window.SharedApp;
    const { CONTACT_EMAIL, INSTAGRAM_URL, INSTAGRAM_EDUCA_URL, RUT_ONG, REG_NUM } = window.SiteConfig;

    /* El equipo, con los cargos tal como los envió la fundación.
       Los colores son los de las áreas definidas en su manual de marca. */
    const EQUIPO = [
      {
        name: 'Chris',
        role: 'Fundadora y responsable de rescates y hogares temporales',
        color: '#E0AB26',
        photo: '/media/equipo/chris-fundadora.webp',
        alt: 'Chris, fundadora de Fundación Proyecto Arca, sosteniendo en brazos a un gato blanco y gris.',
        copy: 'Partió rescatando por su cuenta. Hoy recibe los avisos, evalúa cada caso y busca el hogar temporal donde el gato pueda recuperarse.'
      },
      {
        name: 'Pascal',
        role: 'Presidenta y responsable legal',
        color: '#91BF20',
        photo: '/media/equipo/pascal-presidenta.webp',
        alt: 'Pascal, presidenta de Fundación Proyecto Arca, sentada junto a dos perros.',
        copy: 'Responde por la gestión de la fundación y por que todo lo que hacemos esté en regla: registro, estatutos y compromisos de adopción.'
      },
      {
        name: 'Ángela',
        role: 'Tesorera',
        color: '#B2B24A',
        photo: '/media/equipo/angela-tesorera.webp',
        alt: 'Ángela, tesorera de Fundación Proyecto Arca, con un gato negro en brazos.',
        copy: 'Lleva las cuentas, ordena los gastos veterinarios y responde por cada aporte que recibimos.'
      },
      {
        name: 'Nicole',
        role: 'Responsable de rescates y adopciones',
        color: '#4CA252',
        photo: '/media/equipo/nicole-rescates-adopciones.webp',
        alt: 'Nicole, responsable de rescates y adopciones, abrazando a un gato blanco y naranjo.',
        copy: 'Acompaña las postulaciones, conversa con cada familia y hace el seguimiento después de la entrega.'
      },
      {
        name: 'Alejandra',
        role: 'Responsable de marketing y RRPP',
        color: '#53A3A3',
        photo: '/media/equipo/alejandra-marketing.webp',
        alt: 'Alejandra, responsable de marketing y relaciones públicas, con un gato en brazos.',
        copy: 'Cuenta lo que hacemos, coordina las alianzas y sostiene la difusión de los gatos que esperan familia.'
      },
      {
        name: 'Catalina',
        role: 'Responsable de redes sociales',
        color: '#53A3A3',
        photo: '/media/equipo/catalina-redes-sociales.webp',
        alt: 'Catalina, responsable de redes sociales, abrazando a un gato naranjo y blanco.',
        copy: 'Publica cada rescate, cada gato en adopción y el contenido educativo de @proyectoarcaeduca.'
      }
    ];

    const HITOS = [
      { when: 'Los inicios', title: 'Los primeros rescates', copy: 'Un grupo de mujeres empieza a rescatar gatos en Coquimbo y La Serena, coordinándose por mensajes y financiando con sus propios medios.' },
      { when: '2022', title: 'Identidad propia', copy: 'La fundación define su manual de marca, su logo y la forma en que quiere presentarse: seria, cálida y clara.' },
      { when: 'Hoy', title: 'Siete años después', copy: 'Más de 500 gatos rescatados, más de 40 charlas en jardines y colegios, y adopciones coordinadas entre La Serena, Coquimbo y Santiago.' }
    ];

    const App = () => {
      useReveal();
      return (
        <React.Fragment>
          <Navbar active="nosotras" />
          <main id="contenido">

            <section className="wrap page-hero" aria-labelledby="page-title">
              <div className="reveal">
                <p className="eyebrow"><span className="eyebrow-dot" aria-hidden="true"></span>Quiénes somos</p>
                <h1 id="page-title">Somos todas mujeres, y esto lo hacemos a pulso.</h1>
                <p className="lede">
                  En Fundación Proyecto Arca trabajamos por la protección y el bienestar de los gatos
                  en situación de abandono en las ciudades de La Serena, Coquimbo y Santiago.
                </p>
                <div className="page-hero-actions">
                  <a className="button" href="/adoptar"
                    onClick={() => trackEvent('adoption_start', { placement: 'nosotras_hero' })}>
                    Ver gatitos en adopción <IconArrow size={17} />
                  </a>
                  <a className="button button--outline" href="/donar"
                    onClick={() => trackEvent('donation_start', { placement: 'nosotras_hero' })}>
                    Apoyar el rescate
                  </a>
                </div>
              </div>
            </section>

            <div className="rule" aria-hidden="true"></div>

            {/* Misión, en las palabras de la fundación */}
            <section className="section" aria-labelledby="mision-title">
              <div className="wrap">
                <div className="split">
                  <div className="split-body reveal">
                    <p className="section-label">Nuestra misión</p>
                    <h2 id="mision-title" style={{ fontSize: 'clamp(2.2rem, 5.5vw, 3.6rem)', letterSpacing: '-0.025em', lineHeight: '0.96', marginBottom: '1.2rem' }}>
                      Rescatar, rehabilitar y acompañar hasta el final del proceso.
                    </h2>
                    <p>
                      Rescatamos, rehabilitamos y brindamos los cuidados necesarios a cada gato,
                      acompañando su recuperación y trabajando para encontrarles familias
                      responsables que les ofrezcan una vida digna, segura y llena de amor.
                    </p>
                    <p>
                      Al mismo tiempo, promovemos la tenencia responsable y el respeto hacia los
                      animales mediante la difusión de contenido educativo y la realización de
                      charlas en centros educacionales, buscando generar conciencia desde temprana
                      edad.
                    </p>
                    <p>
                      No tenemos un refugio con puertas abiertas al público. Trabajamos con hogares
                      temporales, veterinarias y voluntarias, porque es la forma en que un equipo
                      pequeño puede sostener cuidados largos sin bajar la calidad de la atención.
                    </p>
                  </div>

                  <figure className="split-figure reveal">
                    <img src="/media/fotos/frida-recuperacion.webp" width="1200" height="900" loading="lazy"
                      alt="Frida, gata rescatada en La Serena, sentada sobre una cama y ya recuperada." />
                    <figcaption><span>Frida</span><span>Rescatada en La Serena</span></figcaption>
                  </figure>
                </div>

                {/* Cifras entregadas por la fundación. El total de adopciones todavía
                    no lo tenemos, así que no aparece. */}
                <div className="stat-grid reveal">
                  <div className="stat">
                    <span className="stat-value">+500</span>
                    <span className="stat-label">Gatos rescatados en siete años de trabajo</span>
                  </div>
                  <div className="stat">
                    <span className="stat-value">+40</span>
                    <span className="stat-label">Charlas educativas en jardines y colegios</span>
                  </div>
                  <div className="stat">
                    <span className="stat-value">100%</span>
                    <span className="stat-label">Voluntario: nadie recibe sueldo por este trabajo</span>
                  </div>
                  <div className="stat">
                    <span className="stat-value">N° 319235</span>
                    <span className="stat-label">Personalidad jurídica vigente y registro público</span>
                  </div>
                </div>
              </div>
            </section>

            {/* Cómo trabajamos */}
            <section className="section section--paper-deep" aria-labelledby="trabajo-title">
              <div className="wrap">
                <div className="section-head reveal">
                  <div>
                    <p className="section-label">Cómo trabajamos</p>
                    <h2 id="trabajo-title">Solo gatos, y hasta el final.</h2>
                  </div>
                  <p>
                    Decidimos especializarnos. En estos siete años también rescatamos alrededor de
                    cien perros, pero hoy trabajamos solo con gatos: una sola especie nos permite
                    conocer sus tiempos, sus enfermedades y sus formas de recuperar la confianza.
                  </p>
                </div>

                <ul className="req-list reveal" style={{ maxWidth: '46rem' }}>
                  <li><IconCheck /> <span>Cada gato entra con evaluación veterinaria: examen general, desparasitación y lo que su caso requiera.</span></li>
                  <li><IconCheck /> <span>Esterilizamos antes de entregar, o dejamos el compromiso firmado cuando el gato es muy pequeño.</span></li>
                  <li><IconCheck /> <span>Los casos crónicos, positivos a inmunodeficiencia o leucemia felina también se rescatan. No descartamos a nadie por su diagnóstico.</span></li>
                  <li><IconCheck /> <span>Ninguna adopción se cierra el mismo día. Conversamos, revisamos el hogar y esperamos a que la decisión esté tomada de verdad.</span></li>
                  <li><IconCheck /> <span>Hacemos seguimiento después de la entrega y seguimos disponibles para dudas o problemas.</span></li>
                </ul>
              </div>
            </section>

            {/* Territorio */}
            <section className="territory-band on-dark" aria-labelledby="territorio-title">
              <div className="wrap territory-grid">
                <div className="territory-copy reveal">
                  <p className="eyebrow">Cuidado sin fronteras</p>
                  <h2 id="territorio-title">Tres ciudades, un mismo equipo.</h2>
                  <p>
                    Nos organizamos entre Coquimbo, La Serena y Santiago. Un gato puede ser rescatado
                    en el norte y encontrar familia en la capital, o al revés. Cuando eso pasa,
                    coordinamos el traslado nosotras mismas.
                  </p>
                  <p style={{ marginBottom: 0 }}>
                    Por seguridad de los gatos no publicamos direcciones. Cada visita, entrega o
                    retiro se coordina antes por correo o por Instagram.
                  </p>
                </div>
                <MapaCuidado />
              </div>
            </section>

            {/* Equipo */}
            <section className="section" aria-labelledby="equipo-title">
              <div className="wrap">
                <div className="section-head reveal">
                  <div>
                    <p className="section-label">El equipo</p>
                    <h2 id="equipo-title">Somos seis, y cada una responde por lo suyo.</h2>
                  </div>
                  <p>
                    Somos un equipo de mujeres voluntarias. Nadie vive de esto: cada una tiene su
                    trabajo, y el rescate ocurre en los tiempos que quedan.
                  </p>
                </div>

                <div className="team-grid">
                  {EQUIPO.map((persona) => (
                    <article className="team-card team-card--photo reveal" key={persona.name}>
                      <figure className="team-photo">
                        <img src={persona.photo} width="700" height="875" loading="lazy"
                          alt={persona.alt} />
                      </figure>
                      <div className="team-card-body">
                        <span className="team-role">
                          <span className="team-swatch" style={{ background: persona.color }} aria-hidden="true"></span>
                          {persona.role}
                        </span>
                        <h3>{persona.name}</h3>
                        <p>{persona.copy}</p>
                      </div>
                    </article>
                  ))}
                </div>
              </div>
            </section>

            {/* Historia */}
            <section className="section section--soft" aria-labelledby="historia-title">
              <div className="wrap">
                <div className="section-head reveal">
                  <div>
                    <p className="section-label">Nuestra historia</p>
                    <h2 id="historia-title">Empezamos sin nada formal.</h2>
                  </div>
                  <p>
                    Primero fueron rescates sueltos, financiados del bolsillo. La fundación llegó
                    después, para poder responder mejor y rendir cuentas de lo que recibimos.
                  </p>
                </div>

                <div className="timeline">
                  {HITOS.map((h) => (
                    <article className="timeline-item reveal" key={h.when}>
                      <span className="timeline-when">{h.when}</span>
                      <div>
                        <h3>{h.title}</h3>
                        <p>{h.copy}</p>
                      </div>
                    </article>
                  ))}
                </div>

                <div className="contact-block reveal" style={{ marginTop: '2.4rem' }}>
                  <h3>Somos una fundación con personalidad jurídica vigente</h3>
                  <p style={{ margin: 0, color: 'var(--muted)', fontSize: '0.92rem' }}>
                    RUT {RUT_ONG} · Registro N° {REG_NUM}. Puedes pedirnos el detalle de cualquier
                    gasto veterinario que hayas ayudado a cubrir, y te lo mostramos.
                  </p>
                </div>
              </div>
            </section>

            {/* Educación */}
            <section className="section" aria-labelledby="educacion-title">
              <div className="wrap">
                <div className="split">
                  <figure className="split-figure reveal">
                    {/* Los rostros de los niños van difuminados a petición de la fundación. */}
                    <img src="/media/fotos/charla-educativa-jardin-infantil.webp" width="1200" height="900" loading="lazy"
                      alt="Charla de tenencia responsable en un jardín infantil: los niños escuchan sentados y un perro acompaña la actividad. Los rostros de los niños están difuminados." />
                    <figcaption><span>Charla en un jardín infantil</span><span>Rostros difuminados</span></figcaption>
                  </figure>

                  <div className="split-body reveal">
                    <p className="section-label">Proyecto Arca Educa</p>
                    <h2 style={{ fontSize: 'clamp(2.2rem, 5.5vw, 3.4rem)', letterSpacing: '-0.025em', lineHeight: '0.96', marginBottom: '1.2rem' }}>
                      Educar también es una forma de rescatar.
                    </h2>
                    <p>
                      Llevamos más de 40 charlas en colegios y jardines infantiles sobre tenencia
                      responsable, esterilización y respeto hacia los animales. Nos interesa llegar
                      temprano: un niño que entiende que un gato siente es un adulto que no abandona.
                    </p>
                    <p>
                      Si trabajas en un establecimiento educacional y quieres una charla, escríbenos.
                      No cobramos por ellas.
                    </p>
                    <div className="page-hero-actions" style={{ marginTop: '1.2rem' }}>
                      <a className="button button--outline" href={INSTAGRAM_EDUCA_URL} target="_blank" rel="noreferrer">
                        Ver @proyectoarcaeduca
                      </a>
                      <a className="button button--outline" href="/contacto"
                        onClick={() => trackEvent('contact_start', { placement: 'nosotras_educa' })}>
                        Solicitar una charla
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <CierreCTA
              titulo="¿Nos acompañas?"
              texto="Adoptar, dar hogar temporal o aportar cada mes. Cualquiera de las tres cambia lo que podemos hacer el próximo rescate."
              acciones={
                <React.Fragment>
                  <a className="button button--light" href="/adoptar"
                    onClick={() => trackEvent('adoption_start', { placement: 'nosotras_cierre' })}>Adoptar</a>
                  <a className="button button--ghost-light" href="/como-ayudar">Otras formas de ayudar</a>
                </React.Fragment>
              }
            />
          </main>
          <Footer />
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
